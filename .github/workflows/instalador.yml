name: Instalador

# Para lançar uma versão: aumente "version" no package.json, faça commit e rode este fluxo (aba Actions > Instalador > Run workflow)
# ou crie uma tag:  git tag v0.2.0 && git push origin v0.2.0
# O instalador (.exe) aparece em Releases. Com o repositório público, o Jarvis instalado se atualiza sozinho.
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # também dá para rodar pelo botão "Run workflow" na aba Actions

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O GitHub só publica uma versão que tenha tag: cria v<version> (do package.json) se ainda não existir
      - name: Criar a tag da versão
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "A tag $v já existe: aumente o version no package.json para lançar outra versão."
          else
            git tag "$v"
            git push origin "$v"
          fi
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
